[build-system]
requires = ["setuptools>=77"]  # PEP 639 license expression
build-backend = "setuptools.build_meta"

[project]
name = "ioc-remedy"
version = "0.1.0"
description = "Find, verify and remediate an injected supply-chain payload across every branch of every GitHub repository you can reach"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ajasad25" }]
keywords = ["security", "supply-chain", "incident-response", "github", "malware-remediation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ajasad25/ioc-remedy"
Repository = "https://github.com/ajasad25/ioc-remedy"
Issues = "https://github.com/ajasad25/ioc-remedy/issues"
Changelog = "https://github.com/ajasad25/ioc-remedy/blob/main/CHANGELOG.md"
"Detection engine" = "https://github.com/ajasad25/ioc-guard"

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
ioc-remedy = "ioc_remedy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Makes `pytest` work in a fresh clone with no install step.
pythonpath = ["src"]
